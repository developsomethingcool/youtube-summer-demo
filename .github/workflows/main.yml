name: Sync to Hugging Face Space

on:
  push:
    branches: [main]

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF }}
        run: |
          git config --global user.email "pometunalexander@gmail.com"
          git config --global user.name "developsomethingcool"
          git remote add hf https://developsomethingcool:$HF@huggingface.co/spaces/developsomethingcool/youtube-summarizer-demo
          git push --force hf main
